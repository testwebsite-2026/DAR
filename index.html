<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAR Batangas — Municipal Records Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F2E8;
    --surface: #FFFFFF;
    --ink: #24261F;
    --muted: #6B6858;
    --line: #DCD5BF;
    --green: #1C4A2E;
    --green-dark: #0F2E1C;
    --green-tint: #E7EEE7;
    --gold: #B8873A;
    --gold-tint: #F4E9D3;
    --rust: #8A3B32;
    --rust-tint: #F3E3DF;
    --radius: 3px;
    --shadow: 0 1px 2px rgba(15,20,15,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans', -apple-system, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Lora', Georgia, serif;
    font-weight:600;
    margin:0;
    color:var(--green-dark);
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ---------- Top ledger bar ---------- */
  .letterhead{
    background:var(--green);
    color:#F5F2E8;
    border-bottom:3px solid var(--gold);
  }
  .letterhead-inner{
    max-width:1080px;
    margin:0 auto;
    padding:14px 24px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .seal{
    width:42px;height:42px;border-radius:50%;
    background:var(--gold-tint);
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .seal svg{width:22px;height:22px;}
  .letterhead-text .agency{
    font-size:11px;letter-spacing:.02em;
    color:#D9E4D9;
    margin:0 0 2px 0;
  }
  .letterhead-text h1{
    color:#FFFFFF;
    font-size:19px;
    line-height:1.2;
  }
  .letterhead-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:#D9E4D9;}
  .btn-logout{
    background:transparent;border:1px solid rgba(255,255,255,0.4);
    color:#F5F2E8;padding:7px 14px;border-radius:var(--radius);
    font-size:13px;font-weight:500;
  }
  .btn-logout:hover{background:rgba(255,255,255,0.1);}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:
      linear-gradient(var(--green-dark), var(--green-dark)) top / 100% 210px no-repeat,
      var(--bg);
    padding:24px;
  }
  .login-card{
    background:var(--surface);
    width:100%;max-width:380px;
    border:1px solid var(--line);
    border-top:4px solid var(--gold);
    border-radius:var(--radius);
    box-shadow:0 8px 28px rgba(15,20,15,0.18);
    padding:32px 30px 28px;
    position:relative;
    z-index:1;
  }
  .login-seal{
    width:64px;height:64px;border-radius:50%;
    background:var(--gold-tint);border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
  }
  .login-seal svg{width:34px;height:34px;}
  .login-card h1{text-align:center;font-size:19px;line-height:1.35;}
  .login-sub{
    text-align:center;color:var(--muted);font-size:12.5px;
    margin:6px 0 24px;letter-spacing:.01em;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:12.5px;font-weight:600;
    color:var(--green-dark);margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%;padding:9px 11px;
    border:1px solid var(--line);border-radius:var(--radius);
    background:#FCFBF7;color:var(--ink);font-size:14px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--green);background:#fff;
  }
  .btn-primary{
    width:100%;background:var(--green);color:#fff;border:none;
    padding:11px 14px;border-radius:var(--radius);font-weight:600;
    font-size:14.5px;letter-spacing:.01em;
  }
  .btn-primary:hover{background:var(--green-dark);}
  .login-error{
    background:var(--rust-tint);color:var(--rust);
    border:1px solid #DDBCB3;border-radius:var(--radius);
    padding:9px 11px;font-size:13px;margin-bottom:16px;
  }
  .login-hint{
    text-align:center;margin-top:18px;font-size:11.5px;color:var(--muted);
    border-top:1px dashed var(--line);padding-top:14px;
  }
  .login-hint code{background:var(--green-tint);padding:1px 5px;border-radius:2px;}

  /* ---------- Shell / layout ---------- */
  .shell{max-width:1080px;margin:0 auto;padding:28px 24px 64px;}
  .breadcrumb{font-size:13px;color:var(--muted);margin-bottom:18px;}
  .breadcrumb button{
    background:none;border:none;color:var(--green);font-weight:600;
    padding:0;font-size:13px;cursor:pointer;
  }
  .breadcrumb button:hover{text-decoration:underline;}

  /* ---------- Hero / search ---------- */
  .hero{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:5px solid var(--green);
    border-radius:var(--radius);
    padding:26px 28px;
    margin-bottom:26px;
    box-shadow:var(--shadow);
  }
  .hero-eyebrow{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:6px;}
  .hero h2{font-size:23px;margin-bottom:6px;}
  .hero p{color:var(--muted);font-size:13.5px;max-width:560px;margin-bottom:18px;}
  .search-row{display:flex;gap:10px;}
  .search-row input{
    flex:1;padding:11px 14px;border:1px solid var(--line);
    border-radius:var(--radius);font-size:14.5px;background:#FCFBF7;
  }
  .search-row input:focus{border-color:var(--green);background:#fff;}
  .search-meta{margin-top:10px;font-size:12.5px;color:var(--muted);}

  .search-results{margin-top:14px;border-top:1px solid var(--line);}
  .result-row{
    display:flex;align-items:center;gap:12px;
    padding:11px 2px;border-bottom:1px solid var(--line);
    background:none;border-left:none;border-right:none;border-top:none;
    width:100%;text-align:left;cursor:pointer;
  }
  .result-row:hover{background:var(--green-tint);}
  .result-title{font-weight:600;color:var(--ink);font-size:14px;}
  .result-sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .tag{
    display:inline-block;font-size:11px;font-weight:600;
    padding:2px 8px;border-radius:20px;
    background:var(--gold-tint);color:#8A6A22;
    white-space:nowrap;
  }

  /* ---------- Clusters grid ---------- */
  .cluster-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:14px;
  }
  .municipality-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
    gap:12px;
    padding:18px 0;
  }
  .municipality-btn{
    background:var(--surface-1);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    cursor:pointer;
    transition:all 0.2s;
    font-weight:600;
    font-size:14px;
    color:var(--ink);
    text-align:center;
  }
  .municipality-btn:hover{
    border-color:var(--green);
    box-shadow:0 4px 8px rgba(28,74,46,0.12);
    background:var(--green-tint);
  }
  .cluster-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    cursor:pointer;
    transition:all 0.2s;
    box-shadow:var(--shadow);
  }
  .cluster-card:hover{
    border-color:var(--green);
    box-shadow:0 4px 8px rgba(28,74,46,0.12);
  }
  .cluster-num{
    font-size:11px;font-weight:700;color:var(--gold);
    text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:6px;
  }
  .cluster-name{
    font-size:14px;font-weight:600;color:var(--ink);
    margin-bottom:8px;line-height:1.35;
  }
  .cluster-office{
    font-size:12px;color:var(--muted);margin-bottom:2px;
  }
  .cluster-muni{
    font-size:11px;color:var(--muted);font-style:italic;
  }

  /* ---------- Folder structure ---------- */
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin-bottom:22px;
  }
  .panel-header{
    border-bottom:1px solid var(--line);
    padding:18px 20px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .panel-header h3{
    font-size:16px;margin:0;
  }
  .local-search{
    flex:1;max-width:280px;
    margin-left:auto;
  }
  .local-search input{
    width:100%;padding:7px 11px;font-size:13px;
    border:1px solid var(--line);border-radius:var(--radius);
    background:#FCFBF7;
  }
  .local-search input:focus{
    border-color:var(--green);background:#fff;
  }

  .folder-list{padding:0;}
  .folder-row{
    display:flex;align-items:center;gap:12px;
    padding:14px 18px;border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background 0.15s;
  }
  .folder-row:hover{background:var(--green-tint);}
  .folder-row:last-child{border-bottom:none;}
  .folder-icon{
    font-size:28px;flex-shrink:0;
  }
  .folder-main{
    flex:1;min-width:0;
  }
  .folder-title{
    font-weight:600;color:var(--ink);font-size:14px;
    margin-bottom:2px;
  }
  .folder-meta{
    font-size:12px;color:var(--muted);
  }

  .empty-state{
    padding:48px 24px;text-align:center;
    background:var(--green-tint);border-radius:var(--radius);
    color:var(--muted);
  }
  .empty-state .big{
    display:block;font-size:18px;font-weight:600;
    color:var(--green-dark);margin-bottom:6px;
  }

  /* ---------- Cluster details ---------- */
  .cluster-details-panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:5px solid var(--green);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:22px;
    box-shadow:var(--shadow);
  }
  .detail-header{
    font-size:12.5px;font-weight:700;color:var(--green);
    text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);
  }
  .detail-row{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:11px 0;border-bottom:1px solid var(--line);
  }
  .detail-row.last{border-bottom:none;}
  .detail-label{
    font-size:12px;font-weight:600;color:var(--green-dark);
    text-transform:uppercase;letter-spacing:.03em;
  }
  .detail-value{
    font-size:13px;color:var(--ink);text-align:right;
    word-break:break-word;max-width:350px;
  }

  /* ---------- File upload & preview ---------- */
  .upload-section{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:22px;
    box-shadow:var(--shadow);
  }
  .upload-title{
    font-size:14px;font-weight:600;color:var(--green-dark);
    margin-bottom:16px;
  }
  .file-input-wrap{
    border:2px dashed var(--line);
    border-radius:var(--radius);
    padding:20px;
    text-align:center;
    background:#FCFBF7;
    margin-bottom:14px;
  }
  .file-input-wrap div:first-child{
    font-weight:600;margin-bottom:8px;color:var(--ink);
  }
  .file-input-wrap input[type="file"]{
    display:block;margin:10px auto 0;
  }
  .file-chosen{
    font-size:12px;color:var(--muted);margin-top:8px;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .file-preview-panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:5px solid var(--gold);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:22px;
    box-shadow:var(--shadow);
  }
  .preview-title{
    font-size:12.5px;font-weight:700;color:var(--green);
    text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:14px;
  }
  .preview-container{
    display:grid;grid-template-columns:1fr 280px;gap:20px;
    align-items:start;
  }
  .preview-main{
    background:#FCFBF7;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    min-height:320px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .preview-image{
    max-width:100%;
    max-height:320px;
    object-fit:contain;
    border-radius:2px;
  }
  .preview-empty{
    color:var(--muted);
    font-size:14px;
    text-align:center;
  }
  .preview-info{
    background:#FCFBF7;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
  }
  .info-row{
    margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line);
  }
  .info-row:last-child{
    margin-bottom:0;padding-bottom:0;border-bottom:none;
  }
  .info-label{
    font-size:11px;font-weight:700;
    color:var(--green);text-transform:uppercase;
    letter-spacing:.03em;margin-bottom:4px;
  }
  .info-value{
    font-size:13.5px;color:var(--ink);
    word-break:break-word;
  }
  .info-value.file-type{
    background:var(--gold-tint);
    color:#8A6A22;
    display:inline-block;
    padding:3px 8px;
    border-radius:3px;
    font-weight:500;
  }

  .form-actions{
    display:flex;gap:10px;margin-top:16px;
  }
  .btn-add, .btn-back{
    flex:1;background:var(--green);color:#fff;border:none;
    padding:11px 14px;border-radius:var(--radius);font-weight:600;
    font-size:14px;cursor:pointer;
  }
  .btn-add:hover, .btn-back:hover{background:var(--green-dark);}
  .btn-back{background:var(--muted);}
  .btn-back:hover{background:#5a5247;}

  .inline-msg{
    border-radius:var(--radius);padding:11px 13px;font-size:13px;
    margin-top:12px;
  }
  .inline-msg.ok{
    background:var(--green-tint);color:var(--green);
    border:1px solid #B8D7BE;
  }
  .inline-msg.err{
    background:var(--rust-tint);color:var(--rust);
    border:1px solid #DDBCB3;
  }

  .record-list{padding:0;}
  .record-row{
    display:flex;align-items:center;gap:12px;
    padding:14px 18px;border-bottom:1px solid var(--line);
  }
  .record-row:last-child{border-bottom:none;}
  .record-icon{
    font-size:24px;flex-shrink:0;
  }
  .record-main{flex:1;min-width:0;}
  .record-title-row{
    display:flex;align-items:center;gap:8px;
    margin-bottom:4px;
  }
  .record-title{font-weight:600;color:var(--ink);font-size:14px;}
  .record-desc{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .record-meta{
    font-size:11px;color:var(--muted);
    display:flex;gap:16px;
  }
  .record-meta span{display:inline;}
  .record-actions{
    display:flex;gap:8px;
  }
  .btn-mini{
    background:var(--green);color:#fff;border:none;
    padding:6px 12px;border-radius:var(--radius);font-size:12px;
    font-weight:600;cursor:pointer;
  }
  .btn-mini:hover{background:var(--green-dark);}
  .btn-mini.danger{background:var(--rust);}
  .btn-mini.danger:hover{background:#6a2b21;}

  .site-footer{
    text-align:center;padding:32px 24px;font-size:12px;
    color:var(--muted);border-top:1px solid var(--line);
  }

  .loading-note{
    padding:40px;text-align:center;color:var(--muted);font-size:14px;
  }

  @media(max-width:768px){
    .preview-container{grid-template-columns:1fr;}
    .preview-main{min-height:280px;}
    .grid-2{grid-template-columns:1fr;}
    .cluster-grid{grid-template-columns:1fr;}
  }
</style>
</head>

    loggedIn:false,
    loginError:'',
    view:'home',
    currentClusterSlug:null,
    currentMunicipalitySlug:null,
    currentFolderSlug:null,

  function restoreAuth(){
    try{
      var saved = localStorage.getItem(AUTH_KEY);
      if(saved){
        state.loggedIn = true;
        loadRecords();
      }
    } catch(e){ }
  }

  function saveAuth(){
    try{
      if(state.loggedIn){
        localStorage.setItem(AUTH_KEY, 'true');
      } else {
        localStorage.removeItem(AUTH_KEY);
      }
    } catch(e){ }
  }

  function saveRecords(callback){
    try{
      var json = JSON.stringify(state.records);
      localStorage.setItem(STORAGE_KEY, json);
      if(callback) callback(true);
    } catch(e){
      if(callback) callback(false);
    }
  }

  function loadRecords(){
    try{
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        state.records = JSON.parse(saved);
      } else {
        state.records = {};
      }
    } catch(e){
      state.loadError = 'Error reading local storage.';
    }
    state.loaded = true;
    render();
  }

  function render(){
    var root = document.getElementById('root');
    if(!state.loggedIn){
      root.innerHTML = renderLogin();
      bindLogin();
      return;
    }
    var html = renderLetterhead() + '<div class="shell">';
    if(!state.loaded){
      html += '<div class="loading-note">Loading records…</div>';
    } else if(state.view==='folder'){
      html += renderFolder();
    } else if(state.view==='municipality'){
      html += renderMunicipality();
    } else if(state.view==='cluster'){
      html += renderCluster();
    } else {
      html += renderHome();
    }
    html += '</div>' + renderFooter();
    root.innerHTML = html;
    bindGlobal();
    if(state.view==='folder') bindFolder();
    if(state.view==='municipality') bindMunicipality();
    if(state.view==='cluster') bindCluster();
    if(state.view==='home') bindHome();
  }

        '<h1>Municipal Records Portal</h1>'+

        '<div class="field"><label for="username">Username</label>'+
          '<input id="username" type="text" placeholder="Enter username" /></div>'+
        '<div class="field"><label for="password">Password</label>'+
          '<input id="password" type="password" placeholder="Enter password" /></div>'+
        (state.loginError ? '<div class="login-error">'+escapeHtml(state.loginError)+'</div>' : '')+
        '<button class="btn-primary" id="login-btn">Sign in</button>'+
        '<div class="login-hint">Demo: <code>admin</code> / <code>admin123</code></div>'+
      '</div>'+
    '</div>';

  function bindLogin(){
    var btn = document.getElementById('login-btn');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var u = document.getElementById('username').value;
      var p = document.getElementById('password').value;
      if(u==='admin' && p==='admin123'){
        state.loggedIn = true;
        state.loginError = '';
        saveAuth();
        loadRecords();
      } else {
        state.loginError = 'Incorrect username or password.';
        render();
      }
    });
    document.getElementById('password').addEventListener('keypress', function(e){
      if(e.key==='Enter') btn.click();

  function bindMunicipality(){
    var back = document.getElementById('back-cluster');
    if(back){
      back.addEventListener('click', function(){
        state.view = 'cluster';
        state.clusterSearch = '';
        render();
      });
    }

    var inputs = [
      {id:'title-number', key:'titleNumber'},
      {id:'seq-number', key:'sequenceNumber'},
      {id:'folder-name', key:'name'},
      {id:'folder-location', key:'location'},
      {id:'folder-area', key:'totalArea'}
    ];
    inputs.forEach(function(inp){
      var el = document.getElementById(inp.id);
      if(el){
        el.addEventListener('input', function(e){
          state.folderForm[inp.key] = e.target.value;
        });
      }
    });

    var createBtn = document.getElementById('create-folder-btn');
    if(createBtn){
      createBtn.addEventListener('click', function(){
        var f = state.folderForm;
        if(!f.titleNumber || !f.sequenceNumber || !f.name || !f.location || !f.totalArea){
          alert('Please fill in all folder details.');
          return;
        }
        createBtn.disabled = true;
        createBtn.textContent = 'Creating…';

        var clusterSlug = state.currentClusterSlug;
        if(!state.records[clusterSlug]) state.records[clusterSlug] = {folders:{}};
        var folderSlug = 'folder-'+Date.now();
        state.records[clusterSlug].folders[folderSlug] = {
          titleNumber:f.titleNumber,
          sequenceNumber:f.sequenceNumber,
          name:f.name,
          location:f.location,
          totalArea:f.totalArea,
          files:[]
        };

        saveRecords(function(success){
          createBtn.disabled = false;
          createBtn.textContent = 'Create Folder';
          if(success){
            state.folderForm = {titleNumber:'', sequenceNumber:'', name:'', location:'', totalArea:''};
            render();
          }
        });
      });
    }

    var search = document.getElementById('municipality-search');
    if(search){
      search.addEventListener('input', function(e){
        state.clusterSearch = e.target.value;
        render();
      });
    }

    document.querySelectorAll('.folder-row').forEach(function(row){
      row.addEventListener('click', function(){
        var slug = row.getAttribute('data-folder');
        state.view = 'folder';
        state.currentFolderSlug = slug;
        state.folderSearch = '';
        render();
      });
    });
  }

  /* ===== RENDERFOLDER ===== */
  function renderFolder(){

    var muniSlug = state.currentMunicipalitySlug;
    var folderSlug = state.currentFolderSlug;
    var cluster = ALL_CLUSTERS.find(function(c){ return c.slug===clusterSlug; });

      return '<div>Folder not found.</div>';
    }
    
    var muni = cluster.municipalities.find(function(m){ return m.slug===muniSlug; });

    var folder = state.records[clusterSlug].folders[folderSlug];

      '<button id="back-cluster">← Back to '+backText+'</button>'+
    '</div>';

              '<div class="info-label">File name</div>'+

              '<div class="info-label">File size</div>'+
              '<div class="info-value">'+formatSize(state.pendingFile.size)+'</div>'+

  function bindFolder(){
    var back = document.getElementById('back-cluster');
    if(back){
      back.addEventListener('click', function(){
        state.view = 'municipality';
        state.folderSearch = '';
        render();
      });
    }

    var fileInput = document.getElementById('file-input');
    if(fileInput){
      fileInput.addEventListener('change', function(e){
        var f = e.target.files[0];
        if(!f) return;
        if(f.size > 10*1024*1024){
          state.uploadMsg = {type:'err', text:'File is larger than 10MB. Please choose a smaller file.'};
          state.pendingFile = null;
          render();
          return;
        }
        var reader = new FileReader();
        reader.onload = function(ev){
          var result = ev.target.result;
          var base64 = result.split(',')[1];
          state.pendingFile = {name:f.name, type:f.type, size:f.size, base64:base64};
          state.uploadMsg = null;
          render();
        };
        reader.onerror = function(){
          state.uploadMsg = {type:'err', text:'Could not read the file. Please try again.'};
          render();
        };
        reader.readAsDataURL(f);
      });
    }

    var search = document.getElementById('folder-search');
    if(search){
      search.addEventListener('input', function(e){
        state.folderSearch = e.target.value;
        render();
      });
    }

    var addBtn = document.getElementById('add-doc-btn');
    if(addBtn){
      addBtn.addEventListener('click', function(){
        var title = document.getElementById('doc-title').value.trim();
        var category = document.getElementById('doc-category').value;
        var desc = document.getElementById('doc-desc').value.trim();
        if(!title){
          state.uploadMsg = {type:'err', text:'Please give the file a name before adding it.'};
          render();
          return;
        }
        addBtn.disabled = true;
        addBtn.textContent = 'Saving…';

        var clusterSlug = state.currentClusterSlug;
        var folderSlug = state.currentFolderSlug;
        if(!state.records[clusterSlug].folders[folderSlug].files){
          state.records[clusterSlug].folders[folderSlug].files = [];
        }
        var file = {
          id:'f'+Date.now()+Math.floor(Math.random()*1000),
          title:title,
          category:category,
          description:desc,
          dateAdded:new Date().toLocaleDateString('en-PH', {year:'numeric', month:'short', day:'numeric'}),
          fileName:state.pendingFile ? state.pendingFile.name : null,
          fileType:state.pendingFile ? state.pendingFile.type : null,
          fileSize:state.pendingFile ? state.pendingFile.size : null,
          fileData:state.pendingFile ? state.pendingFile.base64 : null
        };
        state.records[clusterSlug].folders[folderSlug].files.push(file);

        saveRecords(function(success){
          addBtn.disabled = false;
          addBtn.textContent = 'Add to folder';
          if(success){
            state.uploadMsg = {type:'ok', text:'File added to folder.'};
            state.pendingFile = null;
            document.getElementById('doc-title').value = '';
            document.getElementById('doc-desc').value = '';
          } else {
            state.uploadMsg = {type:'err', text:'Could not save the file. Try again.'};
          }
          render();
        });
      });
    }

    document.querySelectorAll('[data-delete]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-delete');
        if(!confirm('Delete this file? This cannot be undone.')) return;
        var clusterSlug = state.currentClusterSlug;
        var folderSlug = state.currentFolderSlug;
        var files = state.records[clusterSlug].folders[folderSlug].files;
        var before = files.slice();
        state.records[clusterSlug].folders[folderSlug].files = files.filter(function(f){ return f.id!==id; });
        saveRecords(function(success){
          if(!success){
            state.records[clusterSlug].folders[folderSlug].files = before;
            state.uploadMsg = {type:'err', text:'Could not delete the file.'};
          }
          render();
        });
      });
    });

    document.querySelectorAll('[data-download]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-download');
        var clusterSlug = state.currentClusterSlug;
        var folderSlug = state.currentFolderSlug;
        var files = state.records[clusterSlug].folders[folderSlug].files;
        var file = files.find(function(f){ return f.id===id; });
        if(!file || !file.fileData) return;
        try{
          var link = document.createElement('a');
          link.href = 'data:'+(file.fileType||'application/octet-stream')+';base64,'+file.fileData;
          link.download = file.fileName || 'file';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch(e){
          alert('Could not download the file.');
        }
      });
    });
  }

  /* ===== HELPERS ===== */
  function formatSize(bytes){
    if(!bytes) return '';
    if(bytes<1024) return bytes+' B';
    if(bytes<1024*1024) return (bytes/1024).toFixed(0)+' KB';
    return (bytes/(1024*1024)).toFixed(1)+' MB';
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function isImageFile(mimeType){
    if(!mimeType) return false;
    return mimeType.startsWith('image/');
  }
  function getFileType(mimeType){
    if(!mimeType) return 'Unknown';
    var mimeMap = {
      'image/jpeg': 'JPEG Image',
      'image/png': 'PNG Image',
      'image/gif': 'GIF Image',
      'image/webp': 'WebP Image',
      'application/pdf': 'PDF Document',
      'application/msword': 'Word Document',
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document': 'Word Document',
      'text/plain': 'Text File',
      'application/json': 'JSON File',
      'text/csv': 'CSV File'
    };
    return mimeMap[mimeType] || mimeType.split('/')[1] || 'File';
  }

  // Start app
  restoreAuth();
  if(!state.loggedIn){
    render();
  }

})();
</script>
</body>
</html>
